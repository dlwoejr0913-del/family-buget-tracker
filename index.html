<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부부 가계부</title>
    
    <!-- iOS PWA 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="가계부">
    <link rel="apple-touch-icon" href="family-budget-icon.png">
    
    <!-- PWA 매니페스트 -->
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #f8f9fa;
            border: none;
            font-size: 1.1em;
            font-weight: bold;
            color: #495057;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #e9ecef;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .transaction-list {
            margin-top: 30px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .transaction-item:hover {
            background: #e9ecef;
        }

        .transaction-item.income {
            border-left: 4px solid #28a745;
        }

        .transaction-item.expense {
            border-left: 4px solid #dc3545;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-date {
            font-size: 0.9em;
            color: #6c757d;
        }

        .transaction-category {
            font-weight: bold;
            color: #495057;
        }

        .transaction-amount {
            font-size: 1.2em;
            font-weight: bold;
            margin: 0 20px;
        }

        .transaction-amount.income {
            color: #28a745;
        }

        .transaction-amount.expense {
            color: #dc3545;
        }

        .transaction-note {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 5px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .category-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-item:hover {
            background: #e9ecef;
        }

        .category-item.selected {
            background: #667eea;
            color: white;
        }

        .category-color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin: 0 auto 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 1em;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .budget-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .budget-progress {
            flex: 1;
            margin: 0 20px;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }

        .budget-progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .budget-progress-bar.warning {
            background: #ffc107;
        }

        .budget-progress-bar.danger {
            background: #dc3545;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .summary {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .summary-item {
            text-align: center;
        }

        .summary-item h3 {
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .summary-item .value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .summary-item .value.income {
            color: #28a745;
        }

        .summary-item .value.expense {
            color: #dc3545;
        }

        .summary-item .value.balance {
            color: #667eea;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                padding: 15px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💑 부부 가계부</h1>
            <p>함께 관리하는 우리 가족의 재무</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('transactions')">거래 내역</button>
            <button class="tab" onclick="showTab('categories')">카테고리</button>
            <button class="tab" onclick="showTab('statistics')">통계</button>
            <button class="tab" onclick="showTab('budget')">예산 관리</button>
        </div>

        <div id="transactions" class="tab-content active">
            <h2>거래 내역</h2>
            
            <div class="summary">
                <div class="summary-item">
                    <h3>총 수입</h3>
                    <div class="value income" id="totalIncome">₩0</div>
                </div>
                <div class="summary-item">
                    <h3>총 지출</h3>
                    <div class="value expense" id="totalExpense">₩0</div>
                </div>
                <div class="summary-item">
                    <h3>잔액</h3>
                    <div class="value balance" id="balance">₩0</div>
                </div>
            </div>

            <div class="form-group">
                <label>거래 유형</label>
                <select id="transactionType">
                    <option value="expense">지출</option>
                    <option value="income">수입</option>
                </select>
            </div>

            <div class="form-group">
                <label>날짜</label>
                <input type="date" id="transactionDate">
            </div>

            <div class="form-group">
                <label>카테고리</label>
                <select id="transactionCategory">
                    <option value="">카테고리 선택</option>
                </select>
            </div>

            <div class="form-group">
                <label>금액</label>
                <input type="number" id="transactionAmount" placeholder="금액 입력">
            </div>

            <div class="form-group">
                <label>메모</label>
                <textarea id="transactionNote" rows="2" placeholder="메모 입력 (선택사항)"></textarea>
            </div>

            <button class="btn btn-primary" onclick="addTransaction()">거래 추가</button>

            <div class="transaction-list" id="transactionList">
                <!-- 거래 내역이 여기에 표시됩니다 -->
            </div>
        </div>

        <div id="categories" class="tab-content">
            <h2>카테고리 관리</h2>
            
            <div class="form-group">
                <label>새 카테고리 이름</label>
                <input type="text" id="categoryName" placeholder="카테고리 이름">
            </div>

            <div class="form-group">
                <label>카테고리 유형</label>
                <select id="categoryType">
                    <option value="expense">지출</option>
                    <option value="income">수입</option>
                </select>
            </div>

            <div class="form-group">
                <label>카테고리 색상</label>
                <input type="color" id="categoryColor" value="#667eea">
            </div>

            <button class="btn btn-primary" onclick="addCategory()">카테고리 추가</button>

            <div class="category-grid" id="categoryGrid">
                <!-- 카테고리가 여기에 표시됩니다 -->
            </div>
        </div>

        <div id="statistics" class="tab-content">
            <h2>통계</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>이번 달 총 수입</h3>
                    <div class="value" id="monthlyIncome">₩0</div>
                </div>
                <div class="stat-card">
                    <h3>이번 달 총 지출</h3>
                    <div class="value" id="monthlyExpense">₩0</div>
                </div>
                <div class="stat-card">
                    <h3>이번 달 잔액</h3>
                    <div class="value" id="monthlyBalance">₩0</div>
                </div>
            </div>

            <div class="chart-container">
                <h3>카테고리별 지출</h3>
                <canvas id="expenseChart"></canvas>
            </div>

            <div class="chart-container">
                <h3>월별 추이</h3>
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <div id="budget" class="tab-content">
            <h2>예산 관리</h2>
            
            <div class="form-group">
                <label>카테고리</label>
                <select id="budgetCategory">
                    <option value="">카테고리 선택</option>
                </select>
            </div>

            <div class="form-group">
                <label>월 예산</label>
                <input type="number" id="budgetAmount" placeholder="월 예산 설정">
            </div>

            <button class="btn btn-primary" onclick="setBudget()">예산 설정</button>

            <div id="budgetList">
                <!-- 예산 목록이 여기에 표시됩니다 -->
            </div>
        </div>
    </div>

    <script>
        // 데이터 저장소
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        let categories = JSON.parse(localStorage.getItem('categories')) || [
            { id: 1, name: '식비', type: 'expense', color: '#ff6b6b' },
            { id: 2, name: '교통비', type: 'expense', color: '#4ecdc4' },
            { id: 3, name: '주거비', type: 'expense', color: '#45b7d1' },
            { id: 4, name: '교육비', type: 'expense', color: '#96ceb4' },
            { id: 5, name: '의료비', type: 'expense', color: '#ffeaa7' },
            { id: 6, name: '여가비', type: 'expense', color: '#dfe6e9' },
            { id: 7, name: '기타', type: 'expense', color: '#6c5ce7' },
            { id: 8, name: '월급', type: 'income', color: '#00b894' },
            { id: 9, name: ' bonus', type: 'income', color: '#fdcb6e' },
            { id: 10, name: '기타 수입', type: 'income', color: '#e17055' }
        ];
        let budgets = JSON.parse(localStorage.getItem('budgets')) || {};

        // 차트 인스턴스
        let expenseChart = null;
        let monthlyChart = null;

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            // 서비스 워커 등록
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered:', registration);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            }
            
            // 기본 카테고리가 없으면 저장
            if (!localStorage.getItem('categories')) {
                localStorage.setItem('categories', JSON.stringify(categories));
            }
            
            // 오늘 날짜 설정
            document.getElementById('transactionDate').valueAsDate = new Date();
            
            // 데이터 로드
            renderTransactions();
            renderCategories();
            updateStatistics();
            renderBudgets();
            updateCategorySelects();
        });

        // 탭 전환
        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if (tabId === 'statistics') {
                updateStatistics();
            }
        }

        // 거래 추가
        function addTransaction() {
            const type = document.getElementById('transactionType').value;
            const date = document.getElementById('transactionDate').value;
            const categoryId = parseInt(document.getElementById('transactionCategory').value);
            const amount = parseFloat(document.getElementById('transactionAmount').value);
            const note = document.getElementById('transactionNote').value;

            if (!date || !categoryId || !amount) {
                alert('날짜, 카테고리, 금액을 모두 입력해주세요.');
                return;
            }

            const category = categories.find(c => c.id === categoryId);
            
            const transaction = {
                id: Date.now(),
                type,
                date,
                categoryId,
                categoryName: category.name,
                categoryColor: category.color,
                amount,
                note
            };

            transactions.unshift(transaction);
            saveTransactions();
            renderTransactions();
            updateSummary();
            
            // 폼 초기화
            document.getElementById('transactionAmount').value = '';
            document.getElementById('transactionNote').value = '';
        }

        // 거래 삭제
        function deleteTransaction(id) {
            if (confirm('이 거래를 삭제하시겠습니까?')) {
                transactions = transactions.filter(t => t.id !== id);
                saveTransactions();
                renderTransactions();
                updateSummary();
            }
        }

        // 거래 렌더링
        function renderTransactions() {
            const list = document.getElementById('transactionList');
            list.innerHTML = '';

            transactions.forEach(transaction => {
                const item = document.createElement('div');
                item.className = `transaction-item ${transaction.type}`;
                item.innerHTML = `
                    <div class="transaction-info">
                        <div class="transaction-date">${formatDate(transaction.date)}</div>
                        <div class="transaction-category">${transaction.categoryName}</div>
                        ${transaction.note ? `<div class="transaction-note">${transaction.note}</div>` : ''}
                    </div>
                    <div class="transaction-amount ${transaction.type}">
                        ${transaction.type === 'income' ? '+' : '-'}₩${formatNumber(transaction.amount)}
                    </div>
                    <button class="delete-btn" onclick="deleteTransaction(${transaction.id})">삭제</button>
                `;
                list.appendChild(item);
            });

            updateSummary();
        }

        // 요약 업데이트
        function updateSummary() {
            const totalIncome = transactions
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const totalExpense = transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const balance = totalIncome - totalExpense;

            document.getElementById('totalIncome').textContent = `₩${formatNumber(totalIncome)}`;
            document.getElementById('totalExpense').textContent = `₩${formatNumber(totalExpense)}`;
            document.getElementById('balance').textContent = `₩${formatNumber(balance)}`;
        }

        // 카테고리 추가
        function addCategory() {
            const name = document.getElementById('categoryName').value;
            const type = document.getElementById('categoryType').value;
            const color = document.getElementById('categoryColor').value;

            if (!name) {
                alert('카테고리 이름을 입력해주세요.');
                return;
            }

            const category = {
                id: Date.now(),
                name,
                type,
                color
            };

            categories.push(category);
            saveCategories();
            renderCategories();
            updateCategorySelects();
            
            // 폼 초기화
            document.getElementById('categoryName').value = '';
        }

        // 카테고리 삭제
        function deleteCategory(id) {
            if (confirm('이 카테고리를 삭제하시겠습니까?')) {
                categories = categories.filter(c => c.id !== id);
                saveCategories();
                renderCategories();
                updateCategorySelects();
            }
        }

        // 카테고리 렌더링
        function renderCategories() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = '';

            categories.forEach(category => {
                const item = document.createElement('div');
                item.className = 'category-item';
                item.innerHTML = `
                    <div class="category-color" style="background: ${category.color}"></div>
                    <div>${category.name}</div>
                    <div style="font-size: 0.8em; color: #6c757d; margin-top: 5px;">
                        ${category.type === 'income' ? '수입' : '지출'}
                    </div>
                    <button class="delete-btn" onclick="deleteCategory(${category.id})" style="margin-top: 10px;">삭제</button>
                `;
                grid.appendChild(item);
            });
        }

        // 카테고리 선택 옵션 업데이트
        function updateCategorySelects() {
            const selects = ['transactionCategory', 'budgetCategory'];
            
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                const currentValue = select.value;
                select.innerHTML = '<option value="">카테고리 선택</option>';
                
                const type = selectId === 'budgetCategory' ? 'expense' : null;
                const filteredCategories = type 
                    ? categories.filter(c => c.type === type)
                    : categories;
                
                filteredCategories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    select.appendChild(option);
                });
                
                select.value = currentValue;
            });
        }

        // 통계 업데이트
        function updateStatistics() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            // 이번 달 거래 필터링
            const monthlyTransactions = transactions.filter(t => {
                const date = new Date(t.date);
                return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
            });

            const monthlyIncome = monthlyTransactions
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const monthlyExpense = monthlyTransactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const monthlyBalance = monthlyIncome - monthlyExpense;

            document.getElementById('monthlyIncome').textContent = `₩${formatNumber(monthlyIncome)}`;
            document.getElementById('monthlyExpense').textContent = `₩${formatNumber(monthlyExpense)}`;
            document.getElementById('monthlyBalance').textContent = `₩${formatNumber(monthlyBalance)}`;

            // 카테고리별 지출 차트
            updateExpenseChart(monthlyTransactions);
            
            // 월별 추이 차트
            updateMonthlyChart();
        }

        // 지출 차트 업데이트
        function updateExpenseChart(monthlyTransactions) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            const categoryExpenses = {};
            monthlyTransactions
                .filter(t => t.type === 'expense')
                .forEach(t => {
                    if (!categoryExpenses[t.categoryName]) {
                        categoryExpenses[t.categoryName] = {
                            amount: 0,
                            color: t.categoryColor
                        };
                    }
                    categoryExpenses[t.categoryName].amount += t.amount;
                });

            const labels = Object.keys(categoryExpenses);
            const data = labels.map(label => categoryExpenses[label].amount);
            const colors = labels.map(label => categoryExpenses[label].color);

            if (expenseChart) {
                expenseChart.destroy();
            }

            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // 월별 차트 업데이트
        function updateMonthlyChart() {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            
            const monthlyData = {};
            const last6Months = [];
            
            for (let i = 5; i >= 0; i--) {
                const date = new Date();
                date.setMonth(date.getMonth() - i);
                const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                last6Months.push(monthKey);
                monthlyData[monthKey] = { income: 0, expense: 0 };
            }

            transactions.forEach(t => {
                const monthKey = t.date.substring(0, 7);
                if (monthlyData[monthKey]) {
                    if (t.type === 'income') {
                        monthlyData[monthKey].income += t.amount;
                    } else {
                        monthlyData[monthKey].expense += t.amount;
                    }
                }
            });

            const labels = last6Months.map(key => {
                const [year, month] = key.split('-');
                return `${year}년 ${month}월`;
            });

            const incomeData = last6Months.map(key => monthlyData[key].income);
            const expenseData = last6Months.map(key => monthlyData[key].expense);

            if (monthlyChart) {
                monthlyChart.destroy();
            }

            monthlyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '수입',
                            data: incomeData,
                            backgroundColor: '#28a745'
                        },
                        {
                            label: '지출',
                            data: expenseData,
                            backgroundColor: '#dc3545'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // 예산 설정
        function setBudget() {
            const categoryId = parseInt(document.getElementById('budgetCategory').value);
            const amount = parseFloat(document.getElementById('budgetAmount').value);

            if (!categoryId || !amount) {
                alert('카테고리와 예산 금액을 입력해주세요.');
                return;
            }

            budgets[categoryId] = amount;
            saveBudgets();
            renderBudgets();
            
            // 폼 초기화
            document.getElementById('budgetAmount').value = '';
        }

        // 예산 삭제
        function deleteBudget(categoryId) {
            if (confirm('이 예산 설정을 삭제하시겠습니까?')) {
                delete budgets[categoryId];
                saveBudgets();
                renderBudgets();
            }
        }

        // 예산 렌더링
        function renderBudgets() {
            const list = document.getElementById('budgetList');
            list.innerHTML = '';

            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            Object.keys(budgets).forEach(categoryId => {
                const category = categories.find(c => c.id === parseInt(categoryId));
                if (!category) return;

                const budget = budgets[categoryId];
                
                // 이번 달 지출 계산
                const monthlyExpense = transactions
                    .filter(t => {
                        const date = new Date(t.date);
                        return t.type === 'expense' && 
                               t.categoryId === parseInt(categoryId) &&
                               date.getMonth() === currentMonth && 
                               date.getFullYear() === currentYear;
                    })
                    .reduce((sum, t) => sum + t.amount, 0);

                const percentage = Math.min((monthlyExpense / budget) * 100, 100);
                const remaining = budget - monthlyExpense;

                let progressClass = '';
                if (percentage >= 100) {
                    progressClass = 'danger';
                } else if (percentage >= 80) {
                    progressClass = 'warning';
                }

                const item = document.createElement('div');
                item.className = 'budget-item';
                item.innerHTML = `
                    <div style="flex: 1;">
                        <div style="font-weight: bold;">${category.name}</div>
                        <div style="font-size: 0.9em; color: #6c757d;">
                            예산: ₩${formatNumber(budget)} | 지출: ₩${formatNumber(monthlyExpense)} | 잔액: ₩${formatNumber(remaining)}
                        </div>
                    </div>
                    <div class="budget-progress">
                        <div class="budget-progress-bar ${progressClass}" style="width: ${percentage}%"></div>
                    </div>
                    <button class="delete-btn" onclick="deleteBudget(${categoryId})">삭제</button>
                `;
                list.appendChild(item);
            });
        }

        // 데이터 저장 함수들
        function saveTransactions() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        function saveCategories() {
            localStorage.setItem('categories', JSON.stringify(categories));
        }

        function saveBudgets() {
            localStorage.setItem('budgets', JSON.stringify(budgets));
        }

        // 유틸리티 함수들
        function formatNumber(num) {
            return num.toLocaleString('ko-KR');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;
        }
    </script>
</body>
</html>
